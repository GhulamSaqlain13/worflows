name: Node.js CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-actions-practice

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: github-actions-practice/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check JavaScript Syntax
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Pipeline Completed
        run: echo "CI Pipeline completed successfully!"
